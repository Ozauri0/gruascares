services:
  postgres:
    image: postgres:16-alpine
    container_name: gruas-cares-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword} # cambiar fuera de local
      POSTGRES_DB: gruas_cares
    ports:
      - "127.0.0.1:5432:5432" # solo accesible desde esta máquina
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
